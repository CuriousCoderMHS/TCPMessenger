name: Build Windows installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore TCPMessenger/TCPMessenger.csproj

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content TCPMessenger/TCPMessenger.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "TCPMessenger.csproj must define a <Version> value."
          }

          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish application files
        run: dotnet publish TCPMessenger/TCPMessenger.csproj --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\TCPMessenger.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TCP-Messaging-Studio-Setup-win-x64
          path: installer-output/TCPMessenger-Setup.exe
          if-no-files-found: error
