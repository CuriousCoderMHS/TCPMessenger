name: Publish Windows application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore TCPMessenger/TCPMessenger.csproj

      - name: Publish application files
        run: dotnet publish TCPMessenger/TCPMessenger.csproj --configuration Release --runtime win-x64 --self-contained false --output publish

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: TCP-Messaging-Studio-win-x64
          path: publish/
          if-no-files-found: error
